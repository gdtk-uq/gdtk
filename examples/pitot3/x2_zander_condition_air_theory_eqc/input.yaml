# PITOT3 input file using eqc gas models, to kick the types a bit
# Copied from x2_zander_condition_air_theory_custom_driver_condition
# Nick Gibbons and Chris James (c.james4@uq.edu.au)

# initial code set up
mode : 'fully_theoretical'
output_filename : 'x2_zander_condition_air_theory'

# facility set up
facility : 'x2_nozzle'
driver_condition : 'custom'
driver_condition_filename : 'driver.yaml'

# shock tube
test_gas_gas_model : 'custom'
test_gas_filename : 'eq-n2-o2-ions.lua'
p1 : 3000.0 # Pa

# acceleration tube
p5 : 10.0 # Pa
acceleration_tube_expand_to : 'shock_speed'
accelerator_gas_gas_model : 'custom'
accelerator_gas_filename : 'eq-n2-o2-ions.lua'

# nozzle area ratio
area_ratio : 5.64

# test section stuff
cone_half_angle_degrees : 15.0 # degrees
wedge_angle_degrees : 54.0 # degrees
